name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install flet and deps
        run: |
          pip install flet==0.25.2
          pip install -r requirements.txt
      - name: Build APK
        run: flet build apk --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swing-tester-apk
          path: build/apk/*.apk
